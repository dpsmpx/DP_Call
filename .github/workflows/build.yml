name: Build and release

on:
  push:
    branches: [main]
    # Правки документации и описаний не меняют приложение — сборка не нужна.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Временная диагностика: только имена секретов, значения не выводятся.
      - name: List secret names
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "Secrets visible to this job:"
          printf '%s' "$SECRETS_JSON" | jq -r 'to_entries[] | "  \(.key | ascii_downcase) empty=\(.value == "")"'
          echo "Variable names visible to this job:"
          printf '%s' "$VARS_JSON" | jq -r 'keys[] | "  \(ascii_downcase)"'
