name: Build and release

on:
  push:
    branches: [main]
    # Правки документации и описаний не меняют приложение — сборка не нужна.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Сторонние действия закреплены по хешу коммита: тег можно переставить, хеш — нет.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false

      - name: Cache carrier AAR
        id: carrier-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            carrier/mobile.aar
            app/src/experimental/assets/carrier-licenses.txt
          key: carrier-android29-go1261-${{ hashFiles('carrier/*.go', 'carrier/build.sh', 'carrier/UPSTREAM-LICENSE') }}

      - name: Build experimental carrier (pinned upstream, Go race tests)
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384"
          ./carrier/build.sh

      - name: Save built carrier before Android checks
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            carrier/mobile.aar
            app/src/experimental/assets/carrier-licenses.txt
          key: carrier-android29-go1261-${{ hashFiles('carrier/*.go', 'carrier/build.sh', 'carrier/UPSTREAM-LICENSE') }}

      - name: Unit tests and lint
        run: ./gradlew --no-daemon --continue testStandardDebugUnitTest testTorDebugUnitTest testExperimentalDebugUnitTest lintStandardDebug lintTorDebug lintExperimentalDebug

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html

      # Релизная сборка. С секретами репозитория подписывается вашим ключом,
      # без них — общим тестовым ключом из репозитория (см. app/build.gradle.kts).
      - name: Build release APK
        # Секреты подписи доступны только этому шагу, а не сторонним действиям.
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.DPCALL_KEYSTORE_BASE64 || '' }}
          DPCALL_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DPCALL_KEYSTORE_PASSWORD || '' }}
          DPCALL_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.DPCALL_KEY_ALIAS || '' }}
          DPCALL_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DPCALL_KEY_PASSWORD || '' }}
          # Только признак: ключ по ошибке положили в Variables вместо Secrets.
          KEY_IN_VARIABLES: ${{ vars.DPCALL_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export DPCALL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the repository release key"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR validation uses the public test key"
          elif [ "$KEY_IN_VARIABLES" = "true" ]; then
            # Переменные не шифруются и печатаются в журнале, поэтому ключ из них не берётся.
            echo "::error::The signing key is stored in repository Variables. Move all four DPCALL_* values to the Secrets tab (see docs/RELEASING.md)"
            exit 1
          elif [[ "$version" != *-* ]]; then
            # Выпуск нельзя подписывать общим тестовым ключом из репозитория.
            echo "::error::Release $version requires the signing key secrets (see docs/RELEASING.md)"
            exit 1
          else
            echo "::notice::No release keystore in secrets: signing with the shared test key"
          fi
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        id: apks
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          # Версия с суффиксом (1.1.0-dev) — промежуточная сборка, без суффикса — выпуск.
          if [[ "$version" == *-* ]]; then
            tag="v${version}-build.${{ github.run_number }}"
            prerelease=true
          else
            tag="v${version}"
            prerelease=false
          fi
          mkdir -p dist
          # Две сборки: обычная и с встроенным Tor. Имя обычной не меняется — на него
          # ссылаются F-Droid (Binaries) и проверка обновлений в приложении.
          standard=app/build/outputs/apk/standard/release/app-standard-release.apk
          tor=app/build/outputs/apk/tor/release/app-tor-release.apk
          cp "$standard" "dist/DP_Call-${tag}.apk"
          cp "$tor" "dist/DP_Call-Tor-${tag}.apk"
          cp app/build/outputs/apk/experimental/release/app-experimental-release.apk "dist/DP_Call-Experimental-${tag}.apk"
          # Копии с постоянными именами: .../releases/latest/download/DP_Call.apk всегда
          # ведёт на последний выпуск — её рассылает кнопка «Пригласить» в приложении.
          if [ "$prerelease" = "false" ]; then
            cp "$standard" dist/DP_Call.apk
            cp "$tor" dist/DP_Call-Tor.apk
            cp app/build/outputs/apk/experimental/release/app-experimental-release.apk dist/DP_Call-Experimental.apk
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in dist/*.apk; do "$apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" || true; done
          notes="fastlane/metadata/android/ru-RU/changelogs/${code}.txt"
          [ -f "$notes" ] || notes=/dev/null
          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "notes=${notes}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/*

      # Нужен для расшифровки стек-трейсов минифицированной сборки.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping
          path: app/build/outputs/mapping/*Release/mapping.txt
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apks.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump versionName/versionCode to publish a new one."
            exit 0
          fi
          flags=()
          if [ "${{ steps.apks.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --target "${{ github.sha }}" \
            --title "DP Call ${TAG#v}" \
            --notes-file "${{ steps.apks.outputs.notes }}" \
            "${flags[@]}"
