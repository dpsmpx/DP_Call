name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Подписанная релизная сборка — только если в секретах репозитория задан ключ.
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.DPCALL_KEYSTORE_BASE64 }}
          DPCALL_KEYSTORE_PASSWORD: ${{ secrets.DPCALL_KEYSTORE_PASSWORD }}
          DPCALL_KEY_ALIAS: ${{ secrets.DPCALL_KEY_ALIAS }}
          DPCALL_KEY_PASSWORD: ${{ secrets.DPCALL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore configured, skipping the release build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          DPCALL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}-build.${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DP_Call-${tag}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/DP_Call-${tag}.apk"
          fi
          ls -la dist
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apks.outputs.tag }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "DP Call ${{ steps.apks.outputs.tag }}" \
            --prerelease \
            --generate-notes
