name: Repair release source archive

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Build and release run ID
        required: true
        type: string
      tag:
        description: Existing stable release tag
        required: true
        default: v1.4.0
        type: string

permissions:
  contents: write
  actions: read

jobs:
  sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only republish corresponding sources; APKs must already match byte for byte.
      # No downloaded code is executed and signing secrets are not needed.
      - name: Verify and restore source archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > run.json
          jq -e '.head_branch == "main" and .event == "push" and .conclusion == "success" and .path == ".github/workflows/build.yml"' run.json
          mkdir dist verified
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name apk --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          for name in "DP_Call-${RELEASE_TAG}.apk" "DP_Call-Tor-${RELEASE_TAG}.apk" DP_Call.apk DP_Call-Tor.apk; do
            digest="sha256:$(sha256sum "dist/$name" | cut -d' ' -f1)"
            jq -e --arg name "$name" --arg digest "$digest" '.assets | any(.name == $name and .digest == $digest)' release.json
          done
          tar -tzf dist/DP_Call-native-sources.tar.gz > source-files.txt
          rg -Fx './carrier-upstream/vendor/gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird/LICENSE-GPL3.txt' source-files.txt
          rg -Fx './carrier-upstream/vendor/github.com/tladesignz/IPtProxy.git/controller.go' source-files.txt
          rg -Fx './carrier-upstream/native-module-versions.txt' source-files.txt
          gh release upload "$RELEASE_TAG" dist/DP_Call-native-sources.tar.gz dist/SHA256SUMS.txt --repo "$GH_REPO" --clobber
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern DP_Call-native-sources.tar.gz --pattern SHA256SUMS.txt --dir verified
          cmp dist/DP_Call-native-sources.tar.gz verified/DP_Call-native-sources.tar.gz
          cmp dist/SHA256SUMS.txt verified/SHA256SUMS.txt
